<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Kartlar">
<meta name="theme-color" content="#3b6cf6">
<title>Kartlar</title>
<style>
:root{--bg:#f6f6f8;--cd:#fff;--tx:#1b1b1f;--mu:#6b6b76;--ac:#3b6cf6;--bd:#e3e3ea;--r:#e5484d;--o:#f08c00;--g:#2f9e44;--b:#3b6cf6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--cd:#1c1c21;--tx:#f1f1f4;--mu:#9a9aa6;--ac:#6c92ff;--bd:#2c2c34;--r:#ff6b70;--o:#ffa94d;--g:#51cf66;--b:#6c92ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111114;--cd:#1c1c21;--tx:#f1f1f4;--mu:#9a9aa6;--ac:#6c92ff;--bd:#2c2c34;--r:#ff6b70;--o:#ffa94d;--g:#51cf66;--b:#6c92ff;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 16px}h2{margin:8px 0}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row .t{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;margin:6px 0;padding:13px}
button.ghost{border:0;background:none;color:var(--ac);padding:6px 0}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.4}
input,textarea{font:inherit;width:100%;box-sizing:border-box;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
textarea{min-height:72px;resize:vertical}
.face{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:24px;min-height:44vh;display:flex;flex-direction:column;justify-content:center;text-align:center;white-space:pre-wrap;word-break:break-word;margin:12px 0}
.q{font-size:22px;font-weight:600}.a{font-size:19px}
hr{border:0;border-top:1px solid var(--bd);width:100%;margin:16px 0}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:10px 4px;line-height:1.25}.btns small{display:block;color:var(--mu)}
.sec{margin:18px 0 6px;font-weight:600;color:var(--mu);font-size:13px;text-transform:uppercase}
details{margin-top:20px}summary{color:var(--ac);cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
img.ph{display:block;max-width:100%;max-height:32vh;margin:8px auto;border-radius:10px;object-fit:contain}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;margin-right:10px;flex:none}
.pv{display:flex;align-items:center;gap:10px;margin:4px 0}.pv img{max-height:90px;max-width:50%;border-radius:8px}
.btnl{display:block;text-align:center;border:1px dashed var(--bd);border-radius:10px;padding:10px;color:var(--ac);cursor:pointer;margin:4px 0}
.msg{color:var(--r);font-size:14px;margin:6px 0}
.row .t{display:flex;align-items:center}.row .t>div{min-width:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='kartlar-v1';
let S={decks:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isDue=c=>c.due<=Date.now();
let view={v:'home'};
const deck=()=>S.decks.find(d=>d.id===view.id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* SM-2: r = 0 Tekrar, 1 Zor, 2 İyi, 3 Kolay */
function nxt(c,r){
  let e=c.ease,i=c.int,n=c.reps,l=c.lapses;
  if(r===0){n=0;i=0;l++;e=Math.max(1.3,e-.2)}
  else if(r===1){i=c.reps===0?1:Math.max(c.int+1,Math.round(c.int*1.2));e=Math.max(1.3,e-.15);n++}
  else if(r===2){i=c.reps===0?1:c.reps===1?6:Math.max(c.int+1,Math.round(c.int*e));n++}
  else{i=c.reps===0?4:c.reps===1?8:Math.max(c.int+1,Math.round(c.int*e*1.3));e+=.15;n++}
  return{ease:e,int:i,reps:n,lapses:l};
}
function apply(c,r){
  const x=nxt(c,r);c.ease=x.ease;c.int=x.int;c.reps=x.reps;c.lapses=x.lapses;c.last=Date.now();
  if(x.int===0)c.due=Date.now();
  else{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+x.int);c.due=d.getTime()}
}
const lbl=d=>d===0?'&lt;1 dk':d<30?d+' g':d<365?Math.floor(d/30)+' ay':(d/365).toFixed(1)+' yıl';
const newCard=(f,b)=>({id:uid(),f,b,ease:2.5,int:0,reps:0,lapses:0,due:Date.now(),last:null});

/* Görünümler */
function home(){
  return `<h1>Destelerim</h1>`+
  (S.decks.length?S.decks.map(d=>`<div class="row" data-act="open" data-id="${d.id}"><div><b>${esc(d.name)}</b><div class="mu">${d.cards.length} kart · ${d.cards.filter(isDue).length} tekrar bekliyor</div></div><span>›</span></div>`).join(''):'<p class="mu">Henüz deste yok. Aşağıdan ilkini oluşturun.</p>')+
  `<div class="sec">Yeni deste</div><input id="dn" placeholder="Deste adı"><button class="pri" data-act="newdeck">Deste ekle</button>`+
  `<details><summary>Yedekle / geri yükle</summary><p class="mu">Aşağıdaki metni kopyalayıp bir yere kaydedin. Geri yüklemek için yapıştırıp düğmeye basın. Fotoğraflar yedeğe dahil değildir.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><button data-act="restore">Geri yükle</button><div id="bkm" class="mu"></div></details>`;
}
function deckView(){
  const d=deck();if(!d){view={v:'home'};return home()}
  const due=d.cards.filter(isDue).length;
  const ed=view.edit?d.cards.find(c=>c.id===view.edit):null;
  const im=k=>k&&IMG[k]?{id:k,url:IMG[k]}:null;
  const dr=view.dr||(view.dr=ed?{f:ed.f,b:ed.b,fi:im(ed.fi),bi:im(ed.bi)}:{f:'',b:'',fi:null,bi:null});
  const side=(lab,tid,pid,tk,ik)=>`<div class="sec">${lab}</div><textarea id="${tid}" placeholder="Metin (isteğe bağlı)">${esc(dr[tk])}</textarea>`+
    (dr[ik]?`<div class="pv"><img src="${dr[ik].url}" alt=""><div><button class="sm" data-act="rotate" data-id="${ik}">↻ 90° döndür</button><button class="sm" data-act="rmimg" data-id="${ik}">Fotoğrafı kaldır</button></div></div>`
    :`<label class="btnl">📷 Fotoğraf çek / seç<input type="file" accept="image/*" id="${pid}" hidden></label>`);
  return `<div class="top"><button class="ghost" data-act="back">‹ Destelerim</button><button class="sm" data-act="deldeck">${view.confD?'Emin misiniz?':'Desteyi sil'}</button></div>
  <h1>${esc(d.name)}</h1>
  <button class="pri" data-act="study" data-id="sm" ${due?'':'disabled'}>Çalış (aralıklı tekrar) — ${due} kart</button>
  <button class="pri" data-act="study" data-id="sh" ${d.cards.length?'':'disabled'} style="background:var(--cd);color:var(--ac)">Karıştır — tüm kartlar (${d.cards.length})</button>
  <div class="sec" style="margin-top:24px;color:var(--tx);font-size:16px;text-transform:none">${ed?'Kartı düzenle':'Yeni kart'}</div>
  ${side('Ön yüz','cf','pf','f','fi')}${side('Arka yüz','cb','pb','b','bi')}
  ${view.msg?`<div class="msg">${esc(view.msg)}</div>`:''}
  <button class="pri" data-act="savecard">${ed?'Kaydet':'Kart ekle'}</button>${ed?'<button data-act="canceledit" style="width:100%">Vazgeç</button>':''}
  <details><summary>Toplu ekle (sadece metin)</summary><p class="mu">Her satıra bir kart: ön ve arka yüzü sekme (Tab) veya noktalı virgül ile ayırın.</p><textarea id="bulk" placeholder="elma;apple"></textarea><button data-act="bulk">Ekle</button></details>
  <div class="sec">Kartlar</div>`+
  (d.cards.length?d.cards.map(c=>{const th=c.fi&&IMG[c.fi]?c.fi:c.bi&&IMG[c.bi]?c.bi:null;
    return `<div class="row"><div class="t" data-act="edit" data-id="${c.id}">${th?`<img class="thumb" src="${IMG[th]}" alt="">`:''}<div><b>${esc(c.f)||'🖼 Fotoğraf'}</b><div class="mu">${esc(c.b)||'🖼 Fotoğraf'}</div></div></div><button class="sm" data-act="delcard" data-id="${c.id}">${view.confC===c.id?'Emin misiniz?':'Sil'}</button></div>`}).join(''):'<p class="mu">Bu destede kart yok.</p>');
}
function studyView(){
  const d=deck(),c=d&&d.cards.find(x=>x.id===view.q[0]);
  const top=`<div class="top"><button class="ghost" data-act="open" data-id="${view.id}">‹ Bitir</button><span class="mu">${view.mode==='sm'?'Çalış':'Karıştır'} · Kalan: ${view.q.length}</span></div>`;
  if(!c)return top+`<div class="face"><h2>Tamamlandı 🎉</h2><p class="mu">${view.cnt} değerlendirme yaptınız.</p></div><button class="pri" data-act="open" data-id="${view.id}">Kapat</button>`;
  let b;
  if(!view.flip)b=`<button class="pri" data-act="flip">Cevabı göster</button>`;
  else if(view.mode==='sm'){const n=['Tekrar','Zor','İyi','Kolay'],col=['--r','--o','--g','--b'];
    b=`<div class="btns">`+n.map((t,i)=>`<button data-act="ans" data-id="${i}" style="color:var(${col[i]})">${t}<small>${lbl(nxt(c,i).int)}</small></button>`).join('')+`</div>`}
  else b=`<div class="btns"><button data-act="ans" data-id="0" style="color:var(--r)">Bilemedim</button><button data-act="ans" data-id="2" style="color:var(--g)">Bildim</button></div>`;
  return top+`<div class="face" data-act="flip">${ph(c.fi)}${c.f?`<div class="q">${esc(c.f)}</div>`:''}${view.flip?`<hr>${ph(c.bi)}${c.b?`<div class="a">${esc(c.b)}</div>`:''}`:''}</div>`+b;
}
function render(){
  const app=document.getElementById('app');
  app.innerHTML=view.v==='home'?home():view.v==='deck'?deckView():studyView();
  window.scrollTo(0,0);
}

/* Eylemler */
const val=id=>(document.getElementById(id)||{}).value||'';
function sync(){const f=document.getElementById('cf'),b=document.getElementById('cb');if(view.dr&&f&&b){view.dr.f=f.value;view.dr.b=b.value}}
function delImgs(c){[c.fi,c.bi].forEach(k=>{if(k){delete IMG[k];if(db)idbDel(k).catch(()=>{})}})}
async function saveCard(d){
  const f=val('cf').trim(),b=val('cb').trim(),dr=view.dr||{fi:null,bi:null};
  if(!(f||dr.fi)||!(b||dr.bi)){view.msg='Her yüz için metin veya fotoğraf ekleyin.';render();return}
  const c=view.edit?d.cards.find(x=>x.id===view.edit):newCard('','');
  c.f=f;c.b=b;
  for(const k of ['fi','bi']){
    const cur=dr[k],old=c[k];
    if(!cur){if(old)delImgs({fi:old});c[k]=null}
    else if(cur.id){c[k]=cur.id}
    else{const id=uid();IMG[id]=cur.url;c[k]=id;
      try{await idbPut(id,cur.url)}catch(e){view.msg='Fotoğraf kalıcı olarak kaydedilemedi.'}
      if(old)delImgs({fi:old})}
  }
  if(!view.edit)d.cards.push(c);
  view.edit=null;view.dr=null;save();render();
}
function act(a,id){
  sync();view.msg=null;
  const d=view.id?deck():null;
  switch(a){
    case 'open':view={v:'deck',id};break;
    case 'back':view={v:'home'};break;
    case 'newdeck':{const n=val('dn').trim();if(!n)return;S.decks.push({id:uid(),name:n,cards:[]});save();break}
    case 'deldeck':if(!view.confD){view.confD=true;break}d.cards.forEach(delImgs);S.decks=S.decks.filter(x=>x.id!==view.id);save();view={v:'home'};break;
    case 'savecard':saveCard(d);return;
    case 'edit':view.edit=id;view.dr=null;break;
    case 'canceledit':view.edit=null;view.dr=null;break;
    case 'rmimg':view.dr[id]=null;break;
    case 'rotate':rotateCurrent(id);return;
    case 'delcard':if(view.confC!==id){view.confC=id;break}delImgs(d.cards.find(c=>c.id===id));d.cards=d.cards.filter(c=>c.id!==id);view.confC=null;save();break;
    case 'bulk':val('bulk').split('\n').forEach(l=>{const m=l.match(/^(.*?)(?:\t|;)(.*)$/);if(m&&m[1].trim()&&m[2].trim())d.cards.push(newCard(m[1].trim(),m[2].trim()))});save();break;
    case 'study':{const cs=id==='sm'?d.cards.filter(isDue):d.cards;view={v:'study',id:view.id,mode:id,q:shuffle(cs).map(c=>c.id),flip:false,cnt:0};break}
    case 'flip':view.flip=!view.flip;break;
    case 'ans':{const r=+id,cid=view.q.shift(),c=d.cards.find(x=>x.id===cid);view.cnt++;
      if(view.mode==='sm')apply(c,r);if(r===0)view.q.push(cid);view.flip=false;save();break}
    case 'restore':{try{const o=JSON.parse(val('bk'));if(!o||!Array.isArray(o.decks))throw 0;S=o;save();view={v:'home'}}
      catch(e){document.getElementById('bkm').textContent='Geçersiz yedek metni.';return}break}
  }
  render();
}
/* Fotoğrafı önizlemede saat yönünde 90 derece döndür */
async function rotateCurrent(k){
  const item=view.dr&&view.dr[k];
  if(!item||!item.url)return;
  try{
    const img=new Image();
    const loaded=new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
    img.src=item.url;
    await loaded;
    const canvas=document.createElement('canvas');
    canvas.width=img.height;
    canvas.height=img.width;
    const ctx=canvas.getContext('2d');
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.rotate(-Math.PI/2);
    ctx.drawImage(img,-img.width/2,-img.height/2);
    view.dr[k]={id:null,url:canvas.toDataURL('image/jpeg',.85)};
    view.msg=null;
  }catch(e){
    view.msg='Fotoğraf döndürülemedi.';
  }
  render();
}

/* Fotoğraf */
function readImg(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u})}
document.addEventListener('change',async e=>{
  const t=e.target;if(t.id!=='pf'&&t.id!=='pb')return;
  const file=t.files&&t.files[0];if(!file||!view.dr)return;
  sync();
  try{view.dr[t.id==='pf'?'fi':'bi']={id:null,url:await readImg(file)};view.msg=null}catch(err){view.msg='Fotoğraf okunamadı.'}
  render();
});
/* IndexedDB (fotoğraflar) */
let IMG={},db=null;
const ph=k=>k&&IMG[k]?`<img class="ph" src="${IMG[k]}" alt="">`:'';
function idbOpen(){return new Promise((res,rej)=>{
  if(!window.indexedDB){rej(new Error('IndexedDB desteklenmiyor'));return}
  const r=indexedDB.open('kartlar-img',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('img'))r.result.createObjectStore('img')};
  r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();res(db)};
  r.onerror=()=>rej(r.error||new Error('Veritabanı açılamadı'));
  r.onblocked=()=>rej(new Error('Veritabanı başka bir sekme tarafından engellendi'));
})}
function idbPut(k,v){return new Promise((res,rej)=>{if(!db)return rej();const t=db.transaction('img','readwrite');t.objectStore('img').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function idbDel(k){return new Promise((res,rej)=>{if(!db)return rej(new Error('Veritabanı kullanılamıyor'));const t=db.transaction('img','readwrite');t.objectStore('img').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function idbAll(){return new Promise((res,rej)=>{const o={},q=db.transaction('img').objectStore('img').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else res(o)};q.onerror=()=>rej(q.error)})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t.dataset.id)});
/* Arayüzü veritabanı yanıtını beklemeden göster.
   IndexedDB açılmaz/engellenirse uygulama boş ekranda kalmasın. */
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{
  try{
    await idbOpen();
    IMG=await idbAll();
    render();
  }catch(e){
    db=null;
    console.warn('Fotoğraf veritabanı başlatılamadı:',e);
  }
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
